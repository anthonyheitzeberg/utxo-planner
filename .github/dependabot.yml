version: 2

updates:
  # JavaScript dependencies (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait a few days after a release before proposing it. Newly published
    # versions are where compromised packages tend to be caught.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # Dev tooling updates arrive as one PR
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@scure/*"
          - "@noble/*"
      # Runtime minor/patch updates arrive as one PR
      # Excludes @scure/* and @noble/* so Bitcoin and crypto libraries always
      # get their own PR (and security patches are never buried in a group).
      # Major versions of everything also stay as individual PRs.
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@scure/*"
          - "@noble/*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
